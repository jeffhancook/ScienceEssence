<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Essence of Science</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scene">
        <!-- Ambient darkness overlay -->
        <div class="darkness"></div>

        <!-- Library wall background -->
        <div class="library-wall">
            <!-- Bookshelves -->
            <div class="bookshelf shelf-left">
                <div class="shelf-board"></div>
                <div class="books-row">
                    <div class="book-spine" style="--h:85px;--c:#6B1C23;--w:14px"></div>
                    <div class="book-spine" style="--h:92px;--c:#2C1810;--w:18px"></div>
                    <div class="book-spine" style="--h:78px;--c:#4A3728;--w:12px"></div>
                    <div class="book-spine" style="--h:88px;--c:#1B3A2D;--w:16px"></div>
                    <div class="book-spine" style="--h:95px;--c:#3D1F0B;--w:20px"></div>
                    <div class="book-spine" style="--h:82px;--c:#5C3A1E;--w:13px"></div>
                    <div class="book-spine" style="--h:90px;--c:#2A1A3E;--w:17px"></div>
                    <div class="book-spine" style="--h:76px;--c:#6B4423;--w:11px"></div>
                    <div class="book-spine" style="--h:94px;--c:#1F2D1B;--w:15px"></div>
                    <div class="book-spine" style="--h:86px;--c:#4A1A1A;--w:19px"></div>
                </div>
                <div class="shelf-board"></div>
                <div class="books-row">
                    <div class="book-spine" style="--h:80px;--c:#3D2B1F;--w:16px"></div>
                    <div class="book-spine" style="--h:90px;--c:#5A1A1A;--w:14px"></div>
                    <div class="book-spine tilted" style="--h:88px;--c:#2B3D1F;--w:18px"></div>
                    <div class="book-spine" style="--h:75px;--c:#4A2E14;--w:12px"></div>
                    <div class="book-spine" style="--h:92px;--c:#1A2A3D;--w:20px"></div>
                    <div class="book-spine" style="--h:84px;--c:#6B3410;--w:15px"></div>
                    <div class="book-spine" style="--h:88px;--c:#3A1F2B;--w:13px"></div>
                    <div class="book-spine" style="--h:78px;--c:#2D1B00;--w:17px"></div>
                    <div class="book-spine" style="--h:91px;--c:#4A3020;--w:14px"></div>
                </div>
                <div class="shelf-board"></div>
                <div class="books-row">
                    <div class="book-spine" style="--h:82px;--c:#5C2E14;--w:15px"></div>
                    <div class="book-spine" style="--h:93px;--c:#1A1A3D;--w:19px"></div>
                    <div class="book-spine" style="--h:77px;--c:#3D1F00;--w:13px"></div>
                    <div class="book-spine" style="--h:88px;--c:#2E4A14;--w:16px"></div>
                    <div class="book-spine" style="--h:85px;--c:#6B1A2E;--w:12px"></div>
                    <div class="book-spine" style="--h:90px;--c:#3A2B1F;--w:18px"></div>
                    <div class="book-spine" style="--h:79px;--c:#1B2D3A;--w:14px"></div>
                    <div class="book-spine" style="--h:87px;--c:#5A3A1A;--w:17px"></div>
                    <div class="book-spine" style="--h:92px;--c:#2D1B2E;--w:20px"></div>
                    <div class="book-spine" style="--h:81px;--c:#4A2314;--w:11px"></div>
                </div>
                <div class="shelf-board"></div>
            </div>

            <div class="bookshelf shelf-right">
                <div class="shelf-board"></div>
                <div class="books-row">
                    <div class="book-spine" style="--h:88px;--c:#3D1F2B;--w:16px"></div>
                    <div class="book-spine" style="--h:82px;--c:#1A3D2B;--w:14px"></div>
                    <div class="book-spine" style="--h:95px;--c:#5A2E14;--w:19px"></div>
                    <div class="book-spine" style="--h:79px;--c:#2B1A3D;--w:13px"></div>
                    <div class="book-spine" style="--h:91px;--c:#6B3A10;--w:17px"></div>
                    <div class="book-spine" style="--h:84px;--c:#3A1F0B;--w:15px"></div>
                    <div class="book-spine" style="--h:90px;--c:#1F2B3D;--w:18px"></div>
                    <div class="book-spine" style="--h:76px;--c:#5C1A23;--w:12px"></div>
                    <div class="book-spine" style="--h:87px;--c:#4A3728;--w:20px"></div>
                </div>
                <div class="shelf-board"></div>
                <div class="books-row">
                    <div class="book-spine" style="--h:85px;--c:#2D3A1B;--w:15px"></div>
                    <div class="book-spine" style="--h:92px;--c:#6B1C10;--w:18px"></div>
                    <div class="book-spine" style="--h:78px;--c:#1A2B3D;--w:13px"></div>
                    <div class="book-spine tilted" style="--h:90px;--c:#4A1F2E;--w:17px"></div>
                    <div class="book-spine" style="--h:83px;--c:#3D2B00;--w:14px"></div>
                    <div class="book-spine" style="--h:89px;--c:#5A1A3A;--w:19px"></div>
                    <div class="book-spine" style="--h:77px;--c:#2E4A28;--w:12px"></div>
                    <div class="book-spine" style="--h:94px;--c:#3A1B2D;--w:16px"></div>
                </div>
                <div class="shelf-board"></div>
                <div class="books-row">
                    <div class="book-spine" style="--h:90px;--c:#4A2E00;--w:17px"></div>
                    <div class="book-spine" style="--h:80px;--c:#1B3D2E;--w:14px"></div>
                    <div class="book-spine" style="--h:93px;--c:#6B2314;--w:18px"></div>
                    <div class="book-spine" style="--h:78px;--c:#2B1F3D;--w:13px"></div>
                    <div class="book-spine" style="--h:86px;--c:#5A3A28;--w:16px"></div>
                    <div class="book-spine" style="--h:91px;--c:#3D0B1F;--w:20px"></div>
                    <div class="book-spine" style="--h:82px;--c:#2E3A1B;--w:15px"></div>
                    <div class="book-spine" style="--h:88px;--c:#4A1A2B;--w:12px"></div>
                    <div class="book-spine" style="--h:79px;--c:#1F2D00;--w:19px"></div>
                </div>
                <div class="shelf-board"></div>
            </div>
        </div>

        <!-- Desk -->
        <div class="desk">
            <div class="desk-surface"></div>
            <div class="desk-front"></div>
            <div class="desk-edge"></div>
            <!-- Wood grain lines -->
            <svg class="wood-grain" viewBox="0 0 800 40" preserveAspectRatio="none">
                <path d="M0 8 Q200 12 400 7 Q600 3 800 9" stroke="rgba(90,50,20,0.15)" stroke-width="1" fill="none"/>
                <path d="M0 18 Q150 22 350 16 Q550 20 800 17" stroke="rgba(90,50,20,0.12)" stroke-width="1" fill="none"/>
                <path d="M0 28 Q250 32 500 26 Q700 30 800 27" stroke="rgba(90,50,20,0.1)" stroke-width="1" fill="none"/>
            </svg>
        </div>

        <!-- The Book -->
        <div class="main-book">
            <!-- Book shadow -->
            <div class="book-shadow"></div>

            <svg class="book-svg" viewBox="0 0 420 320" width="420" height="320">
                <defs>
                    <!-- Leather cover gradient -->
                    <linearGradient id="leatherGrad" x1="0" y1="0" x2="0.3" y2="1">
                        <stop offset="0%" stop-color="#5A2D0C"/>
                        <stop offset="30%" stop-color="#4A2308"/>
                        <stop offset="60%" stop-color="#3D1C06"/>
                        <stop offset="100%" stop-color="#2E1504"/>
                    </linearGradient>
                    <linearGradient id="leatherLight" x1="0.3" y1="0" x2="0.7" y2="1">
                        <stop offset="0%" stop-color="#7A4420" stop-opacity="0.3"/>
                        <stop offset="100%" stop-color="#2E1504" stop-opacity="0"/>
                    </linearGradient>
                    <!-- Page gradient -->
                    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#F5ECD7"/>
                        <stop offset="50%" stop-color="#EDE2C8"/>
                        <stop offset="100%" stop-color="#E5D9B8"/>
                    </linearGradient>
                    <!-- Gold foil -->
                    <linearGradient id="goldFoil" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#D4A017"/>
                        <stop offset="30%" stop-color="#C5961A"/>
                        <stop offset="50%" stop-color="#E8C252"/>
                        <stop offset="70%" stop-color="#C5961A"/>
                        <stop offset="100%" stop-color="#A07818"/>
                    </linearGradient>
                    <!-- Lamp glow on book -->
                    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
                        <stop offset="0%" stop-color="#FFE0A0" stop-opacity="0.25"/>
                        <stop offset="60%" stop-color="#FFD080" stop-opacity="0.08"/>
                        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
                    </radialGradient>
                </defs>

                <!-- Book cover base -->
                <rect x="10" y="15" width="400" height="290" rx="4" fill="url(#leatherGrad)" stroke="#1A0A02" stroke-width="2"/>
                <!-- Leather highlight -->
                <rect x="10" y="15" width="400" height="290" rx="4" fill="url(#leatherLight)"/>

                <!-- Leather texture (subtle bumps) -->
                <filter id="leatherNoise">
                    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise"/>
                    <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
                    <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply"/>
                </filter>
                <rect x="10" y="15" width="400" height="290" rx="4" fill="rgba(60,30,10,0.08)" filter="url(#leatherNoise)"/>

                <!-- Spine -->
                <rect x="10" y="15" width="30" height="290" rx="3" fill="#2E1504"/>
                <line x1="15" y1="20" x2="15" y2="300" stroke="#4A2308" stroke-width="0.5" opacity="0.5"/>
                <line x1="25" y1="20" x2="25" y2="300" stroke="#4A2308" stroke-width="0.5" opacity="0.5"/>
                <!-- Spine raised bands -->
                <rect x="10" y="55" width="30" height="6" rx="2" fill="#3D1C06" stroke="#2E1504" stroke-width="0.5"/>
                <rect x="10" y="110" width="30" height="6" rx="2" fill="#3D1C06" stroke="#2E1504" stroke-width="0.5"/>
                <rect x="10" y="180" width="30" height="6" rx="2" fill="#3D1C06" stroke="#2E1504" stroke-width="0.5"/>
                <rect x="10" y="245" width="30" height="6" rx="2" fill="#3D1C06" stroke="#2E1504" stroke-width="0.5"/>

                <!-- Page edges (visible from front) -->
                <rect x="42" y="22" width="360" height="276" rx="2" fill="url(#pageGrad)" stroke="#C8B898" stroke-width="0.5"/>
                <!-- Individual page line hints -->
                <line x1="42" y1="25" x2="402" y2="25" stroke="#D8CDB0" stroke-width="0.3"/>
                <line x1="42" y1="28" x2="402" y2="28" stroke="#D8CDB0" stroke-width="0.3"/>
                <line x1="42" y1="293" x2="402" y2="293" stroke="#D8CDB0" stroke-width="0.3"/>
                <line x1="42" y1="295" x2="402" y2="295" stroke="#D8CDB0" stroke-width="0.3"/>

                <!-- Cover recessed panel (embossed border) -->
                <rect x="55" y="35" width="340" height="250" rx="3" fill="none" stroke="url(#goldFoil)" stroke-width="2.5"/>
                <!-- Inner border -->
                <rect x="65" y="45" width="320" height="230" rx="2" fill="none" stroke="url(#goldFoil)" stroke-width="1"/>

                <!-- Corner ornaments (gold filigree) -->
                <!-- Top-left -->
                <g class="corner-ornament" transform="translate(65,45)">
                    <path d="M0 25 Q5 20 10 25 Q8 15 15 10 Q10 5 15 0" stroke="url(#goldFoil)" stroke-width="1.2" fill="none"/>
                    <path d="M0 15 Q8 10 15 15" stroke="url(#goldFoil)" stroke-width="0.8" fill="none"/>
                    <circle cx="5" cy="5" r="2" fill="url(#goldFoil)" opacity="0.6"/>
                </g>
                <!-- Top-right -->
                <g class="corner-ornament" transform="translate(385,45) scale(-1,1)">
                    <path d="M0 25 Q5 20 10 25 Q8 15 15 10 Q10 5 15 0" stroke="url(#goldFoil)" stroke-width="1.2" fill="none"/>
                    <path d="M0 15 Q8 10 15 15" stroke="url(#goldFoil)" stroke-width="0.8" fill="none"/>
                    <circle cx="5" cy="5" r="2" fill="url(#goldFoil)" opacity="0.6"/>
                </g>
                <!-- Bottom-left -->
                <g class="corner-ornament" transform="translate(65,275) scale(1,-1)">
                    <path d="M0 25 Q5 20 10 25 Q8 15 15 10 Q10 5 15 0" stroke="url(#goldFoil)" stroke-width="1.2" fill="none"/>
                    <path d="M0 15 Q8 10 15 15" stroke="url(#goldFoil)" stroke-width="0.8" fill="none"/>
                    <circle cx="5" cy="5" r="2" fill="url(#goldFoil)" opacity="0.6"/>
                </g>
                <!-- Bottom-right -->
                <g class="corner-ornament" transform="translate(385,275) scale(-1,-1)">
                    <path d="M0 25 Q5 20 10 25 Q8 15 15 10 Q10 5 15 0" stroke="url(#goldFoil)" stroke-width="1.2" fill="none"/>
                    <path d="M0 15 Q8 10 15 15" stroke="url(#goldFoil)" stroke-width="0.8" fill="none"/>
                    <circle cx="5" cy="5" r="2" fill="url(#goldFoil)" opacity="0.6"/>
                </g>

                <!-- Central ornamental divider above title -->
                <path d="M140 90 Q160 82 180 88 Q200 78 220 88 Q240 82 260 90" stroke="url(#goldFoil)" stroke-width="1.2" fill="none"/>
                <circle cx="200" cy="82" r="3" fill="url(#goldFoil)"/>

                <!-- === TITLE === -->
                <text x="210" y="130" text-anchor="middle" font-family="'Cinzel Decorative', serif" font-weight="700" font-size="19" fill="url(#goldFoil)" class="book-title-line">The Essence</text>
                <text x="210" y="160" text-anchor="middle" font-family="'Cinzel Decorative', serif" font-weight="700" font-size="16" fill="url(#goldFoil)" class="book-title-line" style="--i:1">of</text>
                <text x="210" y="195" text-anchor="middle" font-family="'Cinzel Decorative', serif" font-weight="900" font-size="24" fill="url(#goldFoil)" class="book-title-line" style="--i:2">Science</text>

                <!-- Divider below title -->
                <path d="M130 215 L270 215" stroke="url(#goldFoil)" stroke-width="1"/>
                <path d="M150 220 L250 220" stroke="url(#goldFoil)" stroke-width="0.6" opacity="0.6"/>
                <!-- Small diamond -->
                <polygon points="200,210 205,215 200,220 195,215" fill="url(#goldFoil)" opacity="0.8"/>

                <!-- Subtitle / author area -->
                <text x="210" y="248" text-anchor="middle" font-family="'EB Garamond', serif" font-style="italic" font-size="11" fill="url(#goldFoil)" opacity="0.6">Volume I</text>

                <!-- Bottom ornament -->
                <path d="M170 260 Q185 255 200 262 Q215 255 230 260" stroke="url(#goldFoil)" stroke-width="1" fill="none" opacity="0.6"/>

                <!-- Lamp glow overlay on book -->
                <rect x="10" y="15" width="400" height="290" rx="4" fill="url(#lampGlow)"/>

                <!-- Wear marks on cover -->
                <path d="M60 40 Q65 38 70 40" stroke="#6B3A18" stroke-width="0.4" fill="none" opacity="0.3"/>
                <path d="M350 280 Q360 278 370 280" stroke="#6B3A18" stroke-width="0.4" fill="none" opacity="0.3"/>
                <circle cx="380" cy="50" r="8" fill="rgba(90,50,20,0.06)"/>
            </svg>

            <!-- Mystical glow emanating from the book -->
            <div class="book-aura"></div>
        </div>

        <!-- Oil lamp -->
        <div class="lamp">
            <svg class="lamp-svg" viewBox="0 0 100 200" width="100" height="200">
                <!-- Lamp base -->
                <ellipse cx="50" cy="190" rx="30" ry="8" fill="#8B6914"/>
                <ellipse cx="50" cy="188" rx="28" ry="7" fill="#A07818"/>
                <path d="M22 188 L26 170 L74 170 L78 188" fill="#8B6914" stroke="#6B5010" stroke-width="0.5"/>
                <!-- Base detail ring -->
                <ellipse cx="50" cy="170" rx="24" ry="6" fill="#A07818" stroke="#8B6914" stroke-width="0.5"/>

                <!-- Lamp stem -->
                <rect x="44" y="120" width="12" height="50" rx="3" fill="#A07818"/>
                <rect x="46" y="122" width="2" height="46" fill="#C8A030" opacity="0.3"/>

                <!-- Oil reservoir -->
                <path d="M30 120 Q28 108 32 100 Q38 92 50 90 Q62 92 68 100 Q72 108 70 120 Z"
                      fill="#A07818" stroke="#8B6914" stroke-width="1"/>
                <path d="M35 115 Q34 108 37 103 Q42 97 50 96 Q58 97 63 103 Q66 108 65 115"
                      fill="#B89028" opacity="0.4"/>

                <!-- Wick holder -->
                <rect x="46" y="82" width="8" height="12" rx="2" fill="#8B6914"/>

                <!-- Wick -->
                <rect x="48" y="72" width="4" height="14" rx="1" fill="#2C1810"/>

                <!-- Glass chimney -->
                <path d="M36 85 Q32 60 38 35 Q42 20 50 15 Q58 20 62 35 Q68 60 64 85"
                      fill="rgba(255,240,200,0.06)" stroke="rgba(200,180,140,0.2)" stroke-width="1"/>
                <path d="M38 80 Q35 60 40 40 Q44 25 50 20"
                      stroke="rgba(255,240,200,0.1)" stroke-width="0.5" fill="none"/>
            </svg>

            <!-- Flame -->
            <div class="flame-container">
                <div class="flame">
                    <div class="flame-inner"></div>
                </div>
            </div>

            <!-- Lamp light cone -->
            <div class="light-cone"></div>
        </div>

        <!-- Warm light overlay (from lamp) -->
        <div class="lamp-light"></div>

        <!-- Dust motes floating in lamplight -->
        <div class="dust-container" id="dustContainer"></div>

        <!-- Scattered items on desk -->
        <div class="desk-items">
            <!-- Quill pen -->
            <svg class="quill" viewBox="0 0 60 120" width="40" height="80">
                <path d="M30 120 L28 60 Q25 40 20 20 Q18 10 25 2 Q35 8 32 20 Q30 35 30 60 Z"
                      fill="#F5F0E0" stroke="#C8B898" stroke-width="0.5"/>
                <path d="M29 120 L29 55" stroke="#2C1810" stroke-width="1.5"/>
                <path d="M28 120 L30 118 L29 120" fill="#2C1810"/>
                <!-- Feather barbs -->
                <path d="M25 30 Q20 25 15 28" stroke="#E8E0D0" stroke-width="0.5" fill="none"/>
                <path d="M24 22 Q18 18 14 22" stroke="#E8E0D0" stroke-width="0.5" fill="none"/>
                <path d="M32 25 Q37 20 40 24" stroke="#E8E0D0" stroke-width="0.5" fill="none"/>
                <path d="M33 18 Q38 14 42 18" stroke="#E8E0D0" stroke-width="0.5" fill="none"/>
            </svg>

            <!-- Inkwell -->
            <svg class="inkwell" viewBox="0 0 40 45" width="35" height="40">
                <path d="M8 15 Q6 25 8 40 L32 40 Q34 25 32 15 Z" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
                <ellipse cx="20" cy="15" rx="12" ry="5" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
                <ellipse cx="20" cy="14" rx="8" ry="3" fill="#0a0a2a"/>
                <!-- Ink glint -->
                <ellipse cx="18" cy="13" rx="2" ry="1" fill="rgba(100,100,180,0.3)"/>
            </svg>

            <!-- Small scroll -->
            <svg class="scroll-item" viewBox="0 0 80 30" width="70" height="26">
                <rect x="5" y="5" width="70" height="20" rx="3" fill="#E8D8B8" stroke="#C8B898" stroke-width="0.5"/>
                <circle cx="5" cy="15" r="6" fill="#E8D8B8" stroke="#C8B898" stroke-width="0.5"/>
                <circle cx="75" cy="15" r="6" fill="#E8D8B8" stroke="#C8B898" stroke-width="0.5"/>
                <!-- Text hints -->
                <line x1="15" y1="11" x2="65" y2="11" stroke="#B8A888" stroke-width="0.4"/>
                <line x1="15" y1="15" x2="60" y2="15" stroke="#B8A888" stroke-width="0.4"/>
                <line x1="15" y1="19" x2="55" y2="19" stroke="#B8A888" stroke-width="0.4"/>
            </svg>
        </div>

        <!-- Arcane symbols floating faintly -->
        <div class="arcane-symbols" id="arcaneSymbols"></div>

        <!-- Vignette -->
        <div class="vignette"></div>

        <!-- Enter prompt -->
        <div class="enter-area">
            <p class="enter-prompt">Open the book...</p>
            <a href="#" class="enter-btn">Enter</a>
        </div>
    </div>

    <script src="cover.js"></script>
</body>
</html>
