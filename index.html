<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScienceEssence</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scene">
        <!-- Sun -->
        <div class="sun">
            <div class="sun-rays"></div>
        </div>

        <!-- Clouds -->
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>

        <!-- Birds -->
        <svg class="bird bird-1" viewBox="0 0 40 20" width="40" height="20">
            <path d="M0 10 Q10 0 20 10 Q30 0 40 10" stroke="#555" stroke-width="2" fill="none"/>
        </svg>
        <svg class="bird bird-2" viewBox="0 0 30 15" width="30" height="15">
            <path d="M0 7 Q7 0 15 7 Q22 0 30 7" stroke="#666" stroke-width="1.5" fill="none"/>
        </svg>
        <svg class="bird bird-3" viewBox="0 0 25 12" width="25" height="12">
            <path d="M0 6 Q6 0 12 6 Q18 0 25 6" stroke="#777" stroke-width="1.5" fill="none"/>
        </svg>

        <!-- Distant hills -->
        <div class="hills">
            <div class="hill hill-far"></div>
            <div class="hill hill-mid"></div>
        </div>

        <!-- Ground plane (grass) -->
        <div class="ground"></div>

        <!-- Grass blades along the horizon line -->
        <svg class="grass-blades-top" viewBox="0 0 1920 60" preserveAspectRatio="none"></svg>

        <!-- Tree + Newton group (anchored to ground) -->
        <div class="tree-newton-group">

            <!-- The full tree SVG -->
            <svg class="tree-svg" viewBox="0 0 400 520" width="400" height="520">
                <defs>
                    <radialGradient id="canopy1" cx="50%" cy="50%">
                        <stop offset="0%" stop-color="#4CAF50"/>
                        <stop offset="80%" stop-color="#2E7D32"/>
                    </radialGradient>
                    <radialGradient id="canopy2" cx="50%" cy="50%">
                        <stop offset="0%" stop-color="#66BB6A"/>
                        <stop offset="80%" stop-color="#388E3C"/>
                    </radialGradient>
                    <radialGradient id="canopy3" cx="50%" cy="50%">
                        <stop offset="0%" stop-color="#81C784"/>
                        <stop offset="80%" stop-color="#43A047"/>
                    </radialGradient>
                    <radialGradient id="canopy4" cx="50%" cy="50%">
                        <stop offset="0%" stop-color="#43A047"/>
                        <stop offset="80%" stop-color="#1B5E20"/>
                    </radialGradient>
                    <radialGradient id="canopy5" cx="40%" cy="45%">
                        <stop offset="0%" stop-color="#7CB342"/>
                        <stop offset="80%" stop-color="#558B2F"/>
                    </radialGradient>
                </defs>

                <!-- Tree shadow on ground -->
                <ellipse cx="200" cy="510" rx="160" ry="12" fill="rgba(0,0,0,0.1)"/>

                <!-- Roots -->
                <path d="M160 490 Q130 500 100 495 Q90 493 85 488" stroke="#4A2E14" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M170 495 Q150 510 125 508" stroke="#4A2E14" stroke-width="6" fill="none" stroke-linecap="round"/>
                <path d="M240 490 Q270 500 300 495 Q310 493 318 488" stroke="#4A2E14" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M230 495 Q250 510 275 508" stroke="#4A2E14" stroke-width="6" fill="none" stroke-linecap="round"/>
                <path d="M195 498 Q190 515 185 520" stroke="#4A2E14" stroke-width="5" fill="none" stroke-linecap="round"/>

                <!-- Main trunk -->
                <path d="M165 490 Q155 440 150 380 Q145 320 155 270 Q160 240 170 210 Q180 185 195 170"
                      stroke="#5D3A1A" stroke-width="28" fill="none" stroke-linecap="round"/>
                <path d="M235 490 Q245 440 248 380 Q250 320 242 270 Q237 240 228 210 Q218 185 205 170"
                      stroke="#5D3A1A" stroke-width="26" fill="none" stroke-linecap="round"/>
                <!-- Trunk fill -->
                <path d="M165 490 Q155 440 150 380 Q145 320 155 270 Q160 240 170 210 Q180 185 195 170
                         L205 170 Q218 185 228 210 Q237 240 242 270 Q250 320 248 380 Q245 440 235 490 Z"
                      fill="#5D3A1A"/>
                <!-- Trunk center highlight -->
                <path d="M185 480 Q180 420 180 360 Q180 300 188 250 Q192 225 198 200"
                      stroke="#6B4423" stroke-width="8" fill="none" opacity="0.5" stroke-linecap="round"/>

                <!-- Bark texture lines -->
                <path d="M175 460 Q185 445 178 430" stroke="#4A2E14" stroke-width="2" fill="none" opacity="0.6"/>
                <path d="M210 440 Q220 425 212 410" stroke="#4A2E14" stroke-width="2" fill="none" opacity="0.6"/>
                <path d="M180 390 Q190 375 183 360" stroke="#4A2E14" stroke-width="2" fill="none" opacity="0.6"/>
                <path d="M215 370 Q225 355 218 340" stroke="#4A2E14" stroke-width="2" fill="none" opacity="0.6"/>
                <path d="M185 320 Q195 305 188 290" stroke="#4A2E14" stroke-width="2" fill="none" opacity="0.6"/>
                <path d="M220 300 Q230 285 222 270" stroke="#4A2E14" stroke-width="2" fill="none" opacity="0.6"/>
                <!-- Knot hole -->
                <ellipse cx="195" cy="350" rx="6" ry="9" fill="#3E2310" opacity="0.7"/>
                <ellipse cx="195" cy="350" rx="3" ry="5" fill="#2A1808"/>

                <!-- Major branches -->
                <!-- Left branch 1 -->
                <path d="M165 290 Q130 260 90 240 Q60 225 40 230"
                      stroke="#5D3A1A" stroke-width="14" fill="none" stroke-linecap="round"/>
                <!-- Left branch 2 -->
                <path d="M158 330 Q120 310 80 300 Q50 295 25 305"
                      stroke="#5D3A1A" stroke-width="10" fill="none" stroke-linecap="round"/>
                <!-- Left sub-branch -->
                <path d="M100 248 Q85 230 70 215" stroke="#5D3A1A" stroke-width="6" fill="none" stroke-linecap="round"/>
                <!-- Right branch 1 -->
                <path d="M235 290 Q270 260 310 240 Q340 225 365 230"
                      stroke="#5D3A1A" stroke-width="14" fill="none" stroke-linecap="round"/>
                <!-- Right branch 2 -->
                <path d="M242 330 Q280 310 320 300 Q350 295 380 305"
                      stroke="#5D3A1A" stroke-width="10" fill="none" stroke-linecap="round"/>
                <!-- Right sub-branch -->
                <path d="M300 248 Q320 230 335 215" stroke="#5D3A1A" stroke-width="6" fill="none" stroke-linecap="round"/>
                <!-- Top branches -->
                <path d="M190 200 Q170 170 150 150" stroke="#5D3A1A" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M210 200 Q230 170 255 150" stroke="#5D3A1A" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M200 180 Q200 150 200 130" stroke="#5D3A1A" stroke-width="7" fill="none" stroke-linecap="round"/>

                <!-- Leaf canopy clusters (behind branches) -->
                <!-- Back layer - darker -->
                <ellipse cx="200" cy="160" rx="85" ry="65" fill="url(#canopy4)" class="leaf-c" style="--d:0s"/>
                <ellipse cx="120" cy="220" rx="70" ry="55" fill="url(#canopy4)" class="leaf-c" style="--d:0.4s"/>
                <ellipse cx="280" cy="220" rx="70" ry="55" fill="url(#canopy4)" class="leaf-c" style="--d:0.8s"/>

                <!-- Mid layer -->
                <ellipse cx="80" cy="250" rx="60" ry="45" fill="url(#canopy1)" class="leaf-c" style="--d:0.2s"/>
                <ellipse cx="320" cy="250" rx="60" ry="45" fill="url(#canopy1)" class="leaf-c" style="--d:0.6s"/>
                <ellipse cx="150" cy="180" rx="65" ry="50" fill="url(#canopy2)" class="leaf-c" style="--d:0.1s"/>
                <ellipse cx="250" cy="180" rx="65" ry="50" fill="url(#canopy2)" class="leaf-c" style="--d:0.5s"/>
                <ellipse cx="200" cy="120" rx="70" ry="50" fill="url(#canopy3)" class="leaf-c" style="--d:0.3s"/>

                <!-- Front layer - brighter -->
                <ellipse cx="140" cy="260" rx="55" ry="40" fill="url(#canopy5)" class="leaf-c" style="--d:0.7s"/>
                <ellipse cx="260" cy="260" rx="55" ry="40" fill="url(#canopy5)" class="leaf-c" style="--d:0.15s"/>
                <ellipse cx="200" cy="150" rx="60" ry="40" fill="url(#canopy3)" class="leaf-c" style="--d:0.45s"/>
                <ellipse cx="100" cy="195" rx="45" ry="35" fill="url(#canopy2)" class="leaf-c" style="--d:0.9s"/>
                <ellipse cx="300" cy="195" rx="45" ry="35" fill="url(#canopy2)" class="leaf-c" style="--d:0.35s"/>

                <!-- Top puffs -->
                <ellipse cx="170" cy="105" rx="40" ry="30" fill="url(#canopy3)" class="leaf-c" style="--d:0.25s"/>
                <ellipse cx="230" cy="105" rx="40" ry="30" fill="url(#canopy5)" class="leaf-c" style="--d:0.55s"/>
                <ellipse cx="200" cy="85" rx="35" ry="28" fill="url(#canopy2)" class="leaf-c" style="--d:0.65s"/>

                <!-- Leaf detail textures (small dark spots) -->
                <circle cx="150" cy="160" r="5" fill="#1B5E20" opacity="0.3"/>
                <circle cx="250" cy="170" r="6" fill="#1B5E20" opacity="0.25"/>
                <circle cx="100" cy="240" r="4" fill="#1B5E20" opacity="0.3"/>
                <circle cx="300" cy="240" r="5" fill="#1B5E20" opacity="0.25"/>
                <circle cx="200" cy="110" r="4" fill="#1B5E20" opacity="0.3"/>

                <!-- Apples on tree -->
                <g class="tree-apple">
                    <circle cx="130" cy="195" r="7" fill="url(#appleGrad)"/>
                    <line x1="130" y1="188" x2="131" y2="183" stroke="#5D3A1A" stroke-width="1.5" stroke-linecap="round"/>
                </g>
                <g class="tree-apple">
                    <circle cx="260" cy="200" r="7" fill="url(#appleGrad)"/>
                    <line x1="260" y1="193" x2="261" y2="188" stroke="#5D3A1A" stroke-width="1.5" stroke-linecap="round"/>
                </g>
                <g class="tree-apple">
                    <circle cx="190" cy="140" r="6" fill="url(#appleGrad)"/>
                    <line x1="190" y1="134" x2="191" y2="130" stroke="#5D3A1A" stroke-width="1.5" stroke-linecap="round"/>
                </g>
                <g class="tree-apple">
                    <circle cx="300" cy="240" r="6" fill="url(#appleGrad)"/>
                    <line x1="300" y1="234" x2="301" y2="230" stroke="#5D3A1A" stroke-width="1.5" stroke-linecap="round"/>
                </g>
                <g class="tree-apple">
                    <circle cx="95" cy="240" r="7" fill="url(#appleGrad)"/>
                    <line x1="95" y1="233" x2="96" y2="228" stroke="#5D3A1A" stroke-width="1.5" stroke-linecap="round"/>
                </g>

                <defs>
                    <radialGradient id="appleGrad" cx="35%" cy="35%">
                        <stop offset="0%" stop-color="#ff5555"/>
                        <stop offset="60%" stop-color="#cc0000"/>
                        <stop offset="100%" stop-color="#8b0000"/>
                    </radialGradient>
                </defs>
            </svg>

            <!-- Falling apple -->
            <div class="falling-apple-wrap">
                <svg viewBox="0 0 20 22" width="20" height="22">
                    <line x1="10" y1="2" x2="11" y2="0" stroke="#5D3A1A" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M11 2 Q14 1 15 3" fill="#4CAF50" stroke="none"/>
                    <circle cx="10" cy="10" r="8" fill="url(#appleGradFall)"/>
                    <defs>
                        <radialGradient id="appleGradFall" cx="35%" cy="35%">
                            <stop offset="0%" stop-color="#ff5555"/>
                            <stop offset="60%" stop-color="#cc0000"/>
                            <stop offset="100%" stop-color="#8b0000"/>
                        </radialGradient>
                    </defs>
                </svg>
            </div>

            <!-- Newton leaning back against tree (back rests on trunk to his right) -->
            <svg class="newton-svg" viewBox="0 0 220 210" width="220" height="210">
                <defs>
                    <!-- Skin shading -->
                    <radialGradient id="skinGrad" cx="45%" cy="40%">
                        <stop offset="0%" stop-color="#F2D4B0"/>
                        <stop offset="70%" stop-color="#E8C39E"/>
                        <stop offset="100%" stop-color="#D4A87C"/>
                    </radialGradient>
                    <!-- Coat fabric gradient -->
                    <linearGradient id="coatGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#8B4513"/>
                        <stop offset="50%" stop-color="#7B3F10"/>
                        <stop offset="100%" stop-color="#6B3410"/>
                    </linearGradient>
                    <!-- Coat highlight -->
                    <linearGradient id="coatHighlight" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#9B5523" stop-opacity="0.5"/>
                        <stop offset="100%" stop-color="#6B3410" stop-opacity="0"/>
                    </linearGradient>
                </defs>

                <!-- Shadow on ground -->
                <ellipse cx="85" cy="202" rx="80" ry="10" fill="rgba(0,0,0,0.1)"/>

                <!-- === LEGS (stretched out to the left, relaxed) === -->
                <!-- Left breeches -->
                <path d="M78 172 Q60 174 38 178 Q22 181 10 184"
                      stroke="#3D2B1F" stroke-width="12" fill="none" stroke-linecap="round"/>
                <!-- Right breeches (crossed slightly over) -->
                <path d="M88 175 Q68 179 48 185 Q32 190 22 192"
                      stroke="#3D2B1F" stroke-width="11" fill="none" stroke-linecap="round"/>
                <!-- Knee buckles -->
                <ellipse cx="38" cy="178" rx="3" ry="2" fill="#DAA520" opacity="0.7"/>
                <ellipse cx="48" cy="185" rx="3" ry="2" fill="#DAA520" opacity="0.7"/>
                <!-- Stockings (white, period-appropriate) -->
                <path d="M10 184 Q4 186 2 188" stroke="#E8E0D8" stroke-width="9" fill="none" stroke-linecap="round"/>
                <path d="M22 192 Q16 194 14 196" stroke="#E8E0D8" stroke-width="8" fill="none" stroke-linecap="round"/>
                <!-- Left shoe with buckle -->
                <path d="M2 188 Q-4 186 -6 189 Q-5 194 2 193 Q6 192 8 190 Z" fill="#1a0f08"/>
                <rect x="-2" y="189" width="5" height="3" rx="0.5" fill="#DAA520" opacity="0.8"/>
                <!-- Right shoe with buckle -->
                <path d="M14 196 Q8 194 6 197 Q7 202 14 201 Q18 200 20 198 Z" fill="#1a0f08"/>
                <rect x="10" y="197" width="5" height="3" rx="0.5" fill="#DAA520" opacity="0.8"/>

                <!-- === BODY (frock coat, leaning back ~25deg) === -->
                <!-- Coat back panel -->
                <path d="M72 175 Q88 148 98 125 Q104 110 108 100
                         L128 100 Q124 110 120 125 Q112 148 98 175 Z"
                      fill="url(#coatGrad)"/>
                <!-- Coat highlight stripe -->
                <path d="M85 170 Q95 145 103 122 Q107 112 110 104"
                      stroke="url(#coatHighlight)" stroke-width="6" fill="none" opacity="0.4"/>
                <!-- Coat left edge seam -->
                <path d="M72 175 Q88 148 98 125 Q104 110 108 100"
                      stroke="#5A2D0C" stroke-width="1.5" fill="none"/>
                <!-- Coat right edge seam -->
                <path d="M98 175 Q112 148 120 125 Q124 110 128 100"
                      stroke="#5A2D0C" stroke-width="1.5" fill="none"/>
                <!-- Coat tails (draping behind) -->
                <path d="M95 175 Q100 182 98 190" stroke="#6B3410" stroke-width="5" fill="none" opacity="0.6" stroke-linecap="round"/>
                <path d="M90 175 Q88 185 90 193" stroke="#6B3410" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round"/>

                <!-- Vest / waistcoat -->
                <path d="M92 160 Q100 140 106 122 Q110 114 112 108
                         L122 108 Q120 114 116 122 Q110 140 102 160 Z"
                      fill="#C8960F" opacity="0.7"/>
                <!-- Vest buttons -->
                <circle cx="107" cy="120" r="1.5" fill="#DAA520"/>
                <circle cx="105" cy="130" r="1.5" fill="#DAA520"/>
                <circle cx="103" cy="140" r="1.5" fill="#DAA520"/>
                <circle cx="100" cy="150" r="1.5" fill="#DAA520"/>
                <!-- Vest edge trim -->
                <path d="M92 160 Q100 140 106 122 Q110 114 112 108"
                      stroke="#B8860B" stroke-width="0.8" fill="none"/>

                <!-- White shirt visible at chest -->
                <path d="M110 105 Q115 108 120 105" fill="white" opacity="0.6"/>

                <!-- Cravat (lace neck cloth) -->
                <path d="M108 100 Q115 108 122 100" stroke="white" stroke-width="3" fill="none"/>
                <path d="M113 103 Q115 108 113 114" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <path d="M117 103 Q115 108 117 114" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <!-- Lace detail on cravat -->
                <path d="M111 112 Q115 116 119 112" stroke="#E8E0D8" stroke-width="1" fill="none"/>
                <circle cx="115" cy="114" r="1" fill="white" opacity="0.5"/>

                <!-- Coat buttons (front) -->
                <circle cx="109" cy="110" r="1.2" fill="#DAA520" opacity="0.6"/>
                <circle cx="108" cy="118" r="1.2" fill="#DAA520" opacity="0.6"/>

                <!-- === LEFT ARM (resting on lap, holding open book) === -->
                <!-- Upper arm -->
                <path d="M100 125 Q88 138 78 150"
                      stroke="#7B3F10" stroke-width="9" fill="none" stroke-linecap="round"/>
                <!-- Forearm -->
                <path d="M78 150 Q70 157 64 162"
                      stroke="#7B3F10" stroke-width="8" fill="none" stroke-linecap="round"/>
                <!-- Shirt cuff peeking out -->
                <path d="M66 160 Q63 162 62 164" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
                <!-- Hand with fingers -->
                <path d="M62 164 Q58 162 56 164 Q55 167 58 168 Q60 168 62 166"
                      fill="url(#skinGrad)" stroke="#D4A87C" stroke-width="0.5"/>
                <path d="M62 166 Q60 170 58 170" stroke="#D4A87C" stroke-width="0.8" fill="none"/>

                <!-- Open book on lap -->
                <g transform="rotate(-10 62 168)">
                    <!-- Book cover -->
                    <rect x="46" y="158" width="28" height="20" rx="2" fill="#6B0000"/>
                    <!-- Book spine -->
                    <line x1="60" y1="158" x2="60" y2="178" stroke="#4A0000" stroke-width="1.5"/>
                    <!-- Left page -->
                    <rect x="48" y="160" width="11" height="16" rx="1" fill="#F5F0E0"/>
                    <!-- Right page -->
                    <rect x="61" y="160" width="11" height="16" rx="1" fill="#F5F0E0"/>
                    <!-- Text lines on pages -->
                    <line x1="50" y1="164" x2="57" y2="164" stroke="#8B7355" stroke-width="0.4" opacity="0.5"/>
                    <line x1="50" y1="167" x2="56" y2="167" stroke="#8B7355" stroke-width="0.4" opacity="0.5"/>
                    <line x1="50" y1="170" x2="57" y2="170" stroke="#8B7355" stroke-width="0.4" opacity="0.5"/>
                    <line x1="63" y1="164" x2="70" y2="164" stroke="#8B7355" stroke-width="0.4" opacity="0.5"/>
                    <line x1="63" y1="167" x2="69" y2="167" stroke="#8B7355" stroke-width="0.4" opacity="0.5"/>
                    <line x1="63" y1="170" x2="70" y2="170" stroke="#8B7355" stroke-width="0.4" opacity="0.5"/>
                    <!-- Gold edge on book cover -->
                    <rect x="46" y="158" width="28" height="20" rx="2" fill="none" stroke="#DAA520" stroke-width="0.5"/>
                </g>

                <!-- === RIGHT ARM (relaxed at side, palm on grass) === -->
                <!-- Upper arm -->
                <path d="M122 118 Q132 132 138 148"
                      stroke="#7B3F10" stroke-width="9" fill="none" stroke-linecap="round"/>
                <!-- Forearm -->
                <path d="M138 148 Q142 160 140 172"
                      stroke="#7B3F10" stroke-width="8" fill="none" stroke-linecap="round"/>
                <!-- Shirt cuff -->
                <path d="M141 168 Q140 172 139 174" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
                <!-- Hand flat on ground with finger hints -->
                <path d="M136 176 Q132 174 130 176 Q129 179 132 180 Q136 180 140 178 Q143 176 142 174 Z"
                      fill="url(#skinGrad)" stroke="#D4A87C" stroke-width="0.5"/>
                <path d="M133 177 Q131 178 131 176" stroke="#D4A87C" stroke-width="0.5" fill="none"/>
                <path d="M136 177 Q135 179 134 178" stroke="#D4A87C" stroke-width="0.5" fill="none"/>

                <!-- === NECK === -->
                <path d="M112 88 Q115 94 118 88" fill="url(#skinGrad)"/>
                <rect x="110" y="84" width="12" height="14" rx="4" fill="url(#skinGrad)"/>
                <!-- Neck shadow -->
                <path d="M111 92 Q116 96 121 92" stroke="#D4A87C" stroke-width="1" fill="none" opacity="0.3"/>

                <!-- === HEAD (tilted back, resting against trunk) === -->
                <g transform="rotate(12 118 68)">
                    <!-- Head shape -->
                    <ellipse cx="118" cy="68" rx="20" ry="24" fill="url(#skinGrad)"/>
                    <!-- Jawline definition -->
                    <path d="M100 72 Q105 85 118 88 Q131 85 136 72" stroke="#D4A87C" stroke-width="0.8" fill="none" opacity="0.3"/>
                    <!-- Ear left -->
                    <ellipse cx="98" cy="68" rx="4" ry="6" fill="#E8C39E"/>
                    <ellipse cx="98" cy="68" rx="2.5" ry="4" fill="#DDB892" opacity="0.5"/>
                    <!-- Ear right (partially hidden by wig) -->
                    <ellipse cx="138" cy="66" rx="3.5" ry="5" fill="#E8C39E"/>

                    <!-- === WIG === -->
                    <!-- Main wig volume -->
                    <path d="M97 70 Q94 50 99 38 Q104 28 118 24 Q132 28 137 38 Q142 50 139 70"
                          fill="#D8D8D8"/>
                    <!-- Wig top volume -->
                    <path d="M100 45 Q105 22 118 20 Q131 22 136 45"
                          fill="#E0E0E0"/>
                    <!-- Part line -->
                    <path d="M118 22 Q118 30 117 40" stroke="#C0C0C0" stroke-width="0.8" fill="none"/>
                    <!-- Wig wave texture -->
                    <path d="M100 40 Q105 37 108 40 Q111 43 114 40" stroke="#C8C8C8" stroke-width="1" fill="none" opacity="0.6"/>
                    <path d="M122 38 Q125 35 128 38 Q131 41 134 38" stroke="#C8C8C8" stroke-width="1" fill="none" opacity="0.6"/>
                    <path d="M98 52 Q102 49 106 52" stroke="#C8C8C8" stroke-width="0.8" fill="none" opacity="0.5"/>
                    <path d="M130 50 Q134 47 138 50" stroke="#C8C8C8" stroke-width="0.8" fill="none" opacity="0.5"/>

                    <!-- Wig curls left (cascading ringlets) -->
                    <path d="M96 58 Q89 63 91 72" stroke="#D0D0D0" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M91 72 Q87 77 90 84" stroke="#C8C8C8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                    <path d="M90 84 Q87 89 90 94" stroke="#C0C0C0" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <!-- Inner curl detail -->
                    <path d="M97 62 Q92 67 94 74" stroke="#BCBCBC" stroke-width="1.5" fill="none" opacity="0.5"/>
                    <path d="M93 76 Q90 81 92 87" stroke="#BCBCBC" stroke-width="1.5" fill="none" opacity="0.5"/>

                    <!-- Wig curls right (cascading ringlets) -->
                    <path d="M140 56 Q147 61 145 70" stroke="#D0D0D0" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M145 70 Q149 75 146 82" stroke="#C8C8C8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                    <path d="M146 82 Q149 87 146 92" stroke="#C0C0C0" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <!-- Inner curl detail -->
                    <path d="M139 60 Q144 65 142 72" stroke="#BCBCBC" stroke-width="1.5" fill="none" opacity="0.5"/>
                    <path d="M143 74 Q146 79 144 85" stroke="#BCBCBC" stroke-width="1.5" fill="none" opacity="0.5"/>

                    <!-- === FACE === -->
                    <!-- Eyes -->
